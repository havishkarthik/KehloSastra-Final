<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" fill="none" role="img" aria-label="Kadali">
  <defs>
    <linearGradient id="kadali-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Icon: leaf/plant motif representing "Kadali" (banana/plantain) -->
  <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#kadali-grad)"/>

  <!-- Stylized leaf icon -->
  <!-- Main leaf -->
  <ellipse cx="24" cy="22" rx="10" ry="14" fill="white" opacity="0.2" transform="rotate(-15, 24, 22)"/>
  <!-- Leaf veins/strokes -->
  <path d="M24 34 C20 28 14 22 18 12 C20 8 28 8 30 12 C34 22 28 28 24 34Z" fill="white" opacity="0.85"/>
  <line x1="24" y1="34" x2="24" y2="12" stroke="#059669" stroke-width="1.2" opacity="0.6"/>
  <line x1="24" y1="22" x2="18" y2="17" stroke="#059669" stroke-width="0.8" opacity="0.5"/>
  <line x1="24" y1="22" x2="30" y2="17" stroke="#059669" stroke-width="0.8" opacity="0.5"/>
  <!-- Stem at bottom -->
  <line x1="24" y1="34" x2="24" y2="38" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

  <!-- Wordmark -->
  <text x="58" y="22" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#059669" letter-spacing="-0.3">Kadali</text>
  <text x="58" y="37" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="8.5" font-weight="600" fill="#64748b" letter-spacing="1">TECH STUDIO</text>
</svg>
